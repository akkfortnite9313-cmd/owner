# Настройки бота. Скопируйте этот файл в config.yaml (1_install.bat делает это сам)
# и заполните. Открывать можно Блокнотом. Строки после # — комментарии.

telegram:
  # Токен бота от @BotFather (как получить — в README.md)
  bot_token: ""
  # Заполнится сам, когда запустите 3_telegram.bat
  chat_id: ""
  # Если эти слова появятся в чате звонка (или в субтитрах) — придёт уведомление.
  # Регистр не важен. Лучше писать части слов: "перекличк" найдёт и «перекличка», и «перекличку».
  mention_keywords:
    - Иванов          # ← ваша фамилия
    - перекличк
    - отметьтесь
    - присутству

settings:
  join_before_min: 1            # за сколько минут до начала заходить в звонок
  look_for_link_before_min: 15  # за сколько минут до начала начинать искать ссылку в ленте
  fallback_after_min: 3         # если новой ссылки нет через N минут после начала — зайти по самой свежей
  admit_wait_min: 15            # сколько ждать, пока преподаватель впустит
  stay_after_end_min: 0         # сколько посидеть после конца пары
  mute_audio: true              # не выводить звук пары на колонки
  watch_captions: true          # включать субтитры: тогда бот услышит и фамилию, сказанную вслух
  browser: auto                 # auto, chrome или msedge
  # Для чётных/нечётных недель: первый день семестра (эта неделя — нечётная)
  # semester_start: 2026-09-01

# Расписание. Для каждой пары:
#   name   — название (любое, должно различаться)
#   days   — дни недели: пн, вт, ср, чт, пт, сб, вс
#   start / end — время начала и конца, в кавычках
#   course — ссылка на курс в Classroom (откройте курс и скопируйте адрес из браузера)
#   meet   — (вместо course) постоянная ссылка на Meet, если она не меняется
#   week   — (необязательно) нечётная / чётная
classes:
  - name: Матанализ
    days: [пн, чт]
    start: "09:00"
    end: "10:30"
    course: https://classroom.google.com/c/ВСТАВЬТЕ_СЮДА

  - name: Английский
    days: ср
    start: "13:00"
    end: "14:30"
    course: https://classroom.google.com/c/ВСТАВЬТЕ_СЮДА_ДРУГОЙ

  # Пример пары только по нечётным неделям с постоянной ссылкой:
  # - name: Физика
  #   days: пт
  #   start: "10:40"
  #   end: "12:10"
  #   meet: https://meet.google.com/abc-defg-hij
  #   week: нечётная
