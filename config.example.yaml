# Пример настроек. Обычно их не нужно писать руками — всё задаётся в окне ClassBot,
# и окно само сохраняет config.yaml. Файл пригодится, если запускать бота без окна
# (python main.py run).

telegram:
  bot_token: ""            # токен бота от @BotFather
  chat_id: ""              # python main.py telegram — заполнит сам
  mention_keywords:        # слова в чате/субтитрах, о которых прислать уведомление
    - Иванов               # ← ваша фамилия
    - перекличк
    - отметьтесь

settings:
  display_name: Иван Иванов     # имя для Zoom, если бот не вошёл в аккаунт Zoom
  zoom_mode: browser            # browser — Zoom в браузере; app — в приложении Zoom
  join_before_min: 1
  look_for_link_before_min: 15
  fallback_after_min: 3
  admit_wait_min: 15
  stay_after_end_min: 0
  mute_audio: true
  watch_captions: true
  browser: auto                 # auto, chrome или msedge
  # semester_start: 01.09.2026  # для чётных/нечётных недель

classes:
  - name: Матанализ
    days: [пн, чт]
    start: "09:00"
    end: "10:30"
    course: https://classroom.google.com/c/ВСТАВЬТЕ_СЮДА   # ссылку на звонок бот найдёт в ленте

  - name: Английский
    days: ср
    start: "13:00"
    end: "14:30"
    link: https://us05web.zoom.us/j/81234567890?pwd=abc    # постоянная ссылка на Zoom или Meet
    # passcode: "123456"                                   # код Zoom, если его нет в ссылке
    # week: нечётная
